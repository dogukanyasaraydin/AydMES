name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET 8) + testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build AydMES.Api -c Release
      - name: Entegrasyon testleri (güvenlik, yetkilendirme, doğrulama)
        run: dotnet test AydMES.Tests -c Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ayd-mes-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ayd-mes-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
